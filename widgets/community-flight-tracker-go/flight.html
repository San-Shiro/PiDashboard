<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  .flight-container {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background-color: var(--canvas-surface, #1e1e1e);
  }
  #flight-map {
    width: 100%;
    height: 100%;
    z-index: 1;
    background-color: var(--canvas-surface, #1e1e1e);
  }
  .flight-overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
    background: var(--canvas-bg-2, rgba(0,0,0,0.6));
    backdrop-filter: blur(4px);
    color: var(--canvas-text, #fff);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', -apple-system, sans-serif;
    border: 1px solid var(--canvas-border, rgba(255,255,255,0.1));
    pointer-events: none;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .plane-icon {
    width: 24px;
    height: 24px;
    transform-origin: center;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .leaflet-container {
    background: transparent;
  }
  /* CartoDB Dark Matter / Light All theming via filter */
  .dark-mode-tiles {
    filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
  }
</style>

<div class="flight-container">
  <div id="flight-map"></div>
  <div class="flight-overlay">
    <span id="flight-count">...</span> flights nearby (Go)
  </div>
</div>

<script>
(function() {
  let map;
  let markers = {};
  const myInstanceId = window.instanceId;
  const root = myInstanceId ? document.getElementById(myInstanceId) : document;
  const mapEl = root.querySelector('#flight-map');
  const countEl = root.querySelector('#flight-count');
  
  // Plane SVG from Material Icons (Airplanes)
  const planeSvg = `<svg viewBox="0 0 24 24" fill="var(--canvas-accent, #3b82f6)" xmlns="http://www.w3.org/2000/svg"><path d="M21 16V14L13 9V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9L2 14V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z"/></svg>`;

  function initMap(config) {
    if (map) return;
    const lat = parseFloat(config.latitude) || 40.7128;
    const lon = parseFloat(config.longitude) || -74.0060;
    const zoom = parseInt(config.zoom) || 8;
    const isDark = config.mapTheme === 'dark';
    
    map = L.map(mapEl, { zoomControl: false, attributionControl: false }).setView([lat, lon], zoom);
    
    const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);
    
    if (isDark) {
      tileLayer.getContainer().classList.add('dark-mode-tiles');
    }
  }

  function updateFlights(flights) {
    if (!map || !flights) return;
    countEl.textContent = flights.length;
    
    const currentIcaos = new Set(flights.map(f => f.icao));
    
    // Remove stale markers
    Object.keys(markers).forEach(icao => {
      if (!currentIcaos.has(icao)) {
        map.removeLayer(markers[icao]);
        delete markers[icao];
      }
    });
    
    // Update or create markers
    flights.forEach(f => {
      const html = `<div class="plane-icon" style="transform: rotate(${f.track}deg)">${planeSvg}</div>`;
      const icon = L.divIcon({ html, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
      
      if (markers[f.icao]) {
        markers[f.icao].setLatLng([f.lat, f.lon]);
        markers[f.icao].setIcon(icon);
      } else {
        markers[f.icao] = L.marker([f.lat, f.lon], { icon }).addTo(map);
      }
    });
  }

  // Apply initial config synchronously to prevent unstyled loading
  let initialConfig = {};
  if (window.widget && window.widget.config && Object.keys(window.widget.config).length > 0) {
    initialConfig = window.widget.config;
  } else {
    let container = document.currentScript ? document.currentScript.closest('[data-config]') : null;
    if (container) {
      try { initialConfig = JSON.parse(container.getAttribute('data-config') || '{}'); } catch(e) {}
    }
  }

  // Check if Leaflet is ready
  const checkL = setInterval(() => {
    if (window.L) {
      clearInterval(checkL);
      initMap(initialConfig);
    }
  }, 100);

  window.widget.register({
    onConfig: function(config) {
      if (window.L && map) {
        const lat = parseFloat(config.latitude) || 40.7128;
        const lon = parseFloat(config.longitude) || -74.0060;
        const zoom = parseInt(config.zoom) || 8;
        map.setView([lat, lon], zoom);
      }
    },
    onState: function(state) {
      if (state.error) {
        countEl.textContent = "Err";
      } else if (state.flights) {
        if (window.L && map) updateFlights(state.flights);
      }
    },
    onRefresh: function() {
      if (map) map.invalidateSize();
    }
  });
})();
</script>
