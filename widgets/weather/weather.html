<style>
  .weather-card {
    background: var(--canvas-surface, rgba(14,165,233,0.18));
    border-radius: 18px;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 18px; box-sizing: border-box;
    font-family: 'Inter', -apple-system, sans-serif;
    position: relative; overflow: hidden;
    border: 1px solid var(--canvas-border, rgba(255,255,255,0.12));
    transition: background 1s ease;
  }
  .weather-card.sunny { background: linear-gradient(135deg, rgba(251,191,36,0.20), rgba(249,115,22,0.18)); }
  .weather-card.rainy { background: linear-gradient(135deg, rgba(71,85,105,0.22), rgba(30,41,59,0.22)); }
  .weather-card.cloudy { background: linear-gradient(135deg, rgba(148,163,184,0.18), rgba(71,85,105,0.22)); }
  .weather-card.night { background: linear-gradient(135deg, rgba(67,56,202,0.24), rgba(30,41,59,0.24)); }
  .weather-card.thunder { background: linear-gradient(135deg, rgba(120,53,15,0.24), rgba(31,41,55,0.28)); }

  .w-location {
    font-size: 11px; opacity: 0.72;
    font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .temp-display { display: flex; align-items: baseline; margin-bottom: 4px; }
  .temp {
    font-size: 54px; font-weight: 800;
    line-height: 1; text-shadow: 0 4px 8px rgba(0,0,0,0.3);
    color: var(--canvas-text);
  }
  .unit { font-size: 22px; margin-left: 4px; opacity: 0.8; color: var(--canvas-text); }
  .condition {
    font-size: 16px; font-weight: 600;
    margin-bottom: auto;
    letter-spacing: 0.04em; color: var(--canvas-text);
  }
  .details {
    display: flex; flex-wrap: wrap;
    gap: 12px; font-size: 12px;
    opacity: 0.9; color: var(--canvas-text);
  }
  .details span { white-space: nowrap; }
  .w-icon {
    position: absolute; right: 14px; top: 10px;
    font-size: 42px; opacity: 0.92;
    transition: all 1s;
    pointer-events: none;
  }
  .weather-status {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.7;
  }
  /* Compact mode */
  .weather-card.compact { flex-direction: row; align-items: center; gap: 12px; padding: 14px; }
  .weather-card.compact .temp { font-size: 36px; }
  .weather-card.compact .unit { font-size: 18px; }
  .weather-card.compact .condition { font-size: 12px; margin-bottom: 0; }
  .weather-card.compact .w-icon { font-size: 28px; right: 14px; top: 14px; transform: none; }
  .weather-card.compact .details { font-size: 11px; gap: 10px; }
</style>

<div id="wStage" style="width:100%;height:100%;overflow:hidden;">
  <div class="weather-card" id="wCard" data-bind-class-name="theme">
    <div class="w-icon" id="wIcon" data-bind="icon">⛅</div>
    <div class="w-location" id="wLoc" data-bind="location">--</div>
    <div class="temp-display">
      <div class="temp" id="wTemp" data-bind="temperature">--</div>
      <div class="unit" id="wUnit">°</div>
    </div>
    <div class="condition" id="wCond" data-bind="condition">Loading...</div>
    <div class="details" id="wDetails">
      <span id="wHumid" data-bind="humidity" data-prefix="💧 " data-suffix="%">💧 --%</span>
      <span id="wWind" data-bind="wind" data-prefix="💨 " data-suffix=" mph">💨 -- mph</span>
      <span id="wFeel" data-bind="feels_like" data-prefix="🌡 Feels " data-suffix="°" data-bind-show="feels_like" style="display:none">🌡 Feels --°</span>
    </div>
    <div class="weather-status" id="wStatus"></div>
  </div>
</div>

<script>
(function() {
  let container = document.currentScript ? document.currentScript.closest('[data-config]') : null;
  if (!container && window.instanceId) container = document.getElementById(window.instanceId);
  
  if (container) {
    let cfg = {};
    if (window.widget && window.widget.config && Object.keys(window.widget.config).length > 0) {
      cfg = window.widget.config;
    } else {
      try { cfg = JSON.parse(container.getAttribute('data-config') || '{}'); } catch(e) {}
    }
    
    let wCard = container.querySelector('.weather-card');
    if (cfg.textColor && wCard) {
      wCard.style.color = cfg.textColor;
      wCard.style.setProperty('--canvas-text', cfg.textColor);
    }
  }
})();
</script>
